<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pixel Town</title>
<style>
  :root {
    --ink: #0b0e1a;
    --panel: rgba(16, 18, 32, 0.88);
    --line: #3a4466;
    --text: #c0cbdc;
    --accent: #2ce8f5;
    --accent-dim: #124e89;
  }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--ink);
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color: var(--text);
    -webkit-font-smoothing: none;
  }

  canvas {
    position: absolute;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: var(--ink);
  }

  #hud {
    position: absolute;
    left: 14px;
    bottom: 14px;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: 9px 11px 8px;
    min-width: 232px;
    background: var(--panel);
    border: 2px solid var(--line);
    box-shadow: 0 0 0 2px rgba(11, 14, 26, 0.9), 0 6px 18px rgba(0, 0, 0, 0.45);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    user-select: none;
  }

  #hud .title {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    color: var(--accent);
    font-size: 11px;
    letter-spacing: 0.18em;
  }

  #clock {
    color: var(--text);
    font-size: 12px;
  }

  #clock[data-phase="night"] {
    color: #8b9bb4;
  }

  #hud .row {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
  }

  button {
    font: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    color: var(--text);
    background: #262b44;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    padding: 3px 7px;
    cursor: pointer;
  }

  button:hover {
    background: #3a4466;
  }

  button.on {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: #eafaff;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 10px;
    background: #262b44;
    border: 1px solid var(--line);
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 8px;
    height: 12px;
    background: var(--accent);
    border: 1px solid #0b0e1a;
  }

  input[type="range"]::-moz-range-thumb {
    width: 8px;
    height: 12px;
    border-radius: 0;
    background: var(--accent);
    border: 1px solid #0b0e1a;
  }

  #fallback {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 24px;
    text-align: center;
    background: var(--ink);
    font-size: 13px;
    line-height: 1.6;
  }

  #fallback[hidden] {
    display: none;
  }

  #fallback h1 {
    margin: 0 0 8px;
    color: var(--accent);
    font-size: 16px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  #fallback pre {
    margin: 4px 0 10px;
    padding: 8px 14px;
    border: 1px solid var(--line);
    background: #262b44;
    color: #eafaff;
  }

  #fallback b,
  #fallback code {
    color: var(--accent);
  }

  .hint {
    color: #5a6988;
    font-size: 9px;
    letter-spacing: 0.04em;
    text-transform: none;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <canvas id="town" width="384" height="216"></canvas>

  <div id="hud">
    <div class="row title">
      <span>Pixel Town</span>
      <span id="clock">08:30</span>
    </div>
    <div class="row"><input id="time" type="range" min="0" max="24" step="0.25" value="8.5" /></div>
    <div class="row" id="weather"></div>
    <div class="row" id="toggles"></div>
    <div class="row hint">1-4 weather · space pause · ←/→ time · A auto · H hide</div>
  </div>

  <div id="fallback" hidden>
    <h1>Pixel Town</h1>
    <p>This page loads ES modules, so it needs to be served over HTTP.</p>
    <p>From this folder, run:</p>
    <pre>npm install
npm run dev</pre>
    <p>and open <b>http://localhost:5173</b></p>
    <p>Any static server works too: <code>python -m http.server 8000</code></p>
  </div>

  <script type="module" src="./src/main.js"></script>
  <script>
    // ES modules are blocked on file:// - tell the user instead of showing a blank page.
    setTimeout(function () {
      if (window.__town) return;
      document.getElementById('fallback').hidden = false;
      document.getElementById('hud').style.display = 'none';
    }, 1500);
  </script>
</body>
</html>
