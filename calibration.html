<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pixel Town · calibration card</title>
<style>
  :root {
    --ink: #0b0e1a;
    --panel: rgba(16, 18, 32, 0.9);
    --line: #3a4466;
    --text: #c0cbdc;
    --accent: #2ce8f5;
  }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--ink);
    font-family: ui-monospace, Menlo, Consolas, monospace;
    color: var(--text);
  }

  canvas {
    position: absolute;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  #readout {
    position: absolute;
    left: 12px;
    bottom: 12px;
    z-index: 2;
    padding: 8px 10px;
    background: var(--panel);
    border: 2px solid var(--line);
    font-size: 10px;
    line-height: 1.6;
    letter-spacing: 0.04em;
    user-select: none;
  }

  #readout b {
    color: var(--accent);
    font-weight: 600;
  }

  #legend {
    position: absolute;
    right: 12px;
    top: 12px;
    z-index: 2;
    padding: 8px 10px;
    background: var(--panel);
    border: 2px solid var(--line);
    font-size: 10px;
    line-height: 1.7;
    text-align: right;
  }

  #legend a {
    color: var(--accent);
    text-decoration: none;
  }

  #legend a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <canvas id="card" width="640" height="360"></canvas>

  <div id="legend">
    calibration card · field <a href="?target=400">400</a> · <a href="?target=480">480</a> · <a href="?target=560">560</a><br />
    <a href="?grid=0">no grid</a> · <a href="?labels=0">no labels</a> · <a href="?">reset</a>
  </div>

  <div id="readout">…</div>

  <script type="module" src="./src/next/calibration.js"></script>
</body>
</html>
